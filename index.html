<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸 | Professional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glow: #00d2ff; --bg: #010101; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; overflow-x: hidden; height: 100%; width: 100%; }
        
        /* बैकग्राउंड स्टार्स */
        #stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }

        /* लॉगिन बॉक्स */
        .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; width: 100%; }
        .auth-box { background: rgba(15, 15, 15, 0.98); border: 2px solid var(--glow); padding: 30px; border-radius: 25px; width: 85%; max-width: 360px; text-align: center; box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--glow); margin-bottom: 15px; }

        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 1rem; box-sizing: border-box; }
        
        /* बटन क्लिक इफेक्ट */
        .primary-btn { width: 100%; padding: 15px; background: var(--glow); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.1rem; transition: 0.2s; }
        .primary-btn:active { transform: scale(0.92); background: #fff; }

        .toggle-link { margin-top: 20px; color: #888; font-size: 0.9rem; cursor: pointer; }
        .toggle-link span { color: var(--glow); font-weight: bold; text-decoration: underline; }

        /* मुख्य वेबसाइट (शुरू में छुपी रहेगी) */
        #dashboard { display: none; padding-top: 80px; text-align: center; }
        nav { position: fixed; top: 0; width: 100%; background: #000; padding: 15px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-around; z-index: 1000; }
        .batch-card { background: #0a0a0a; border: 1px solid #333; border-radius: 15px; padding: 20px; margin: 15px auto; width: 90%; max-width: 400px; border-left: 5px solid var(--glow); }
        .batch-link { color: var(--glow); text-decoration: none; font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="stars-bg"></div>

    <div id="login-section" class="auth-container">
        <div class="auth-box">
            <img src="https://files.catbox.moe/qik5aw.png" class="profile-img">
            <h2 id="form-title">🔐 LOGIN</h2>
            <input type="email" id="user-email" placeholder="Email एड्रेस">
            <div id="mobile-div" style="display:none;">
                <input type="number" id="user-mobile" placeholder="मोबाइल नंबर (10 अंक)">
            </div>
            <input type="password" id="user-pass" placeholder="पासवर्ड">
            <button class="primary-btn" id="submit-btn" onclick="startAuth()">प्रवेश करें</button>
            <p class="toggle-link" onclick="switchForm()">नया यूजर? <span id="toggle-txt">यहाँ रजिस्टर करें</span></p>
            <p style="font-size: 10px; color: #444; margin-top: 20px;">© 2026 SACHIN SHARMA</p>
        </div>
    </div>

    <div id="dashboard">
        <nav>
            <div style="color:var(--glow); font-weight:bold;">➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸</div>
            <div onclick="signOutUser()" style="color:red; cursor:pointer;">LOGOUT</div>
        </nav>
        <h1>स्वागत है, सचिन भाई!</h1>
        <div class="batch-card">
            <h3>SSC Pratham Batch</h3>
            <a href="https://robust-tan-ayf5zif9ft.edgeone.app/" class="batch-link">ओपन बैच</a>
        </div>
        <div class="batch-card">
            <h3>SSC CGL Foundation</h3>
            <a href="https://courageous-maroon-khztehhvyz.edgeone.app/" class="batch-link">ओपन बैच</a>
        </div>
    </div>

    <script>
        // आपकी सुपबेस डिटेल्स
        const URL = "https://jnhkojxsckdgsvaagfhc.supabase.co";
        const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaGtvanhzY2tkZ3N2YWFnZmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDIxMDYsImV4cCI6MjA5NDk3ODEwNn0.hPBHq55bv9F0g9-mmgukyYZdZc-YM_Ye4B7IPsGdles";
        
        const sb = window.supabase.createClient(URL, KEY);
        let loginMode = true;

        function switchForm() {
            loginMode = !loginMode;
            document.getElementById('form-title').innerText = loginMode ? "🔐 LOGIN" : "📝 REGISTER";
            document.getElementById('mobile-div').style.display = loginMode ? "none" : "block";
            document.getElementById('submit-btn').innerText = loginMode ? "प्रवेश करें" : "अकाउंट बनाएं";
            document.getElementById('toggle-txt').innerText = loginMode ? "यहाँ रजिस्टर करें" : "लॉगिन करें";
        }

        async function startAuth() {
            const email = document.getElementById('user-email').value.trim();
            const pass = document.getElementById('user-pass').value.trim();
            const mobile = document.getElementById('user-mobile').value.trim();
            const btn = document.getElementById('submit-btn');

            if(!email || !pass) return alert("ईमेल और पासवर्ड भरें!");

            btn.innerText = "प्रोसेसिंग...";
            btn.disabled = true;

            try {
                if(loginMode) {
                    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
                    if(error) throw error;
                    enterApp();
                } else {
                    if(mobile.length !== 10) throw new Error("नंबर 10 अंकों का होना चाहिए!");
                    const { error } = await sb.auth.signUp({ 
                        email, password: pass, 
                        options: { data: { phone: mobile } } 
                    });
                    if(error) throw error;
                    alert("सफलता! अपना ईमेल चेक करें और लिंक पर क्लिक करें।");
                }
            } catch (e) {
                alert("सूचना: " + e.message);
            } finally {
                btn.innerText = loginMode ? "प्रवेश करें" : "अकाउंट बनाएं";
                btn.disabled = false;
            }
        }

        async function enterApp() {
            const { data: { user } } = await sb.auth.getUser();
            if(user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            }
        }

        function signOutUser() { sb.auth.signOut().then(() => location.reload()); }
        window.onload = enterApp;
    </script>
</body>
</html>
