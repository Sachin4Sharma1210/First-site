<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸 | Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glow: #00d2ff; --bg: #010101; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; overflow-x: hidden; height: 100%; }
        #canvas-stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); }

        /* --- AUTH INTERFACE --- */
        .auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .auth-box { background: rgba(10, 10, 10, 0.95); border: 2px solid var(--glow); padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); position: relative; z-index: 10; }
        .profile-img-auth { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--glow); margin-bottom: 15px; object-fit: cover; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; font-size: 1rem; box-sizing: border-box; outline: none; }
        .auth-btn { width: 100%; padding: 14px; background: var(--glow); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #000; margin-top: 10px; font-size: 1.1rem; }

        /* --- DASHBOARD INTERFACE --- */
        #main-content { display: none; padding-top: 80px; text-align: center; width: 100%; }
        nav { position: fixed; top: 0; width: 100%; padding: 15px 0; display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid #222; }

        /* MENU TABS */
        .menu-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 40px; padding: 20px; }
        .menu-card { background: rgba(255,255,255,0.05); border: 2px solid var(--glow); padding: 25px; border-radius: 20px; width: 160px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .menu-card:hover { transform: scale(1.05); background: var(--glow); color: #000; }

        /* SECTIONS */
        .content-section { display: none; padding: 20px; min-height: 70vh; width: 100%; box-sizing: border-box; }
        .content-section.active { display: block; }

        /* Batch Styles (Normal) */
        .magic-btn { position: relative; padding: 20px; background: #000; color: #fff; text-decoration: none; border-radius: 15px; overflow: hidden; display: block; margin: 15px auto; width: 90%; max-width: 450px; z-index: 1; }
        .rainbow-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150%; height: 600%; background: conic-gradient(#ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000); animation: rotateBg 3s linear infinite; z-index: -1; }
        .magic-btn::after { content: ''; position: absolute; inset: 3px; background: #0a0a0a; border-radius: 12px; z-index: 0; }
        .btn-content { position: relative; z-index: 3; }

        /* Batch Card Styles (Demo/All) */
        .demo-card { background: #0a0a0a; border: 1px solid #222; border-radius: 15px; width: 300px; margin: 15px; overflow: hidden; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .demo-card img { width: 100%; height: 170px; object-fit: cover; border-bottom: 1px solid #222; }
        .card-body { padding: 15px; }
        .buy-method-box { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px dashed #444; margin: 10px 0; font-size: 0.8rem; line-height: 1.4; }
        .phonepe-btn { display: block; background: #5f259f; color: #fff; padding: 10px; text-decoration: none; font-weight: bold; text-align: center; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; }
        .screenshot-btn { display: block; background: #00ff00; color: #000; padding: 12px; text-decoration: none; font-weight: bold; text-align: center; border-radius: 8px; font-size: 1rem; }

        .back-btn { background: #333; color: white; border: none; padding: 12px 25px; border-radius: 30px; cursor: pointer; margin: 40px auto; display: block; font-weight: bold; }
        @keyframes rotateBg { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        footer { background: #000; padding: 40px 20px; border-top: 1px solid #111; color: #555; margin-top: 50px; text-align: center; }
    </style>
</head>
<body>

    <canvas id="canvas-stars"></canvas>

    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <img src="https://files.catbox.moe/qik5aw.png" class="profile-img-auth">
            <h2 id="title">🔐 लॉगिन</h2>
            <input type="email" id="email" placeholder="ईमेल">
            <div id="reg-extra" style="display:none;"><input type="text" id="mobile" placeholder="मोबाइल नंबर"></div>
            <input type="password" id="password" placeholder="पासवर्ड">
            <div id="otp-area" style="display:none;"><input type="text" id="otp" placeholder="OTP यहाँ डालें"></div>
            <button class="auth-btn" id="action-btn" onclick="processAuth()">प्रवेश करें</button>
            <div style="margin-top:20px; font-weight:bold;">
                <p id="toggle-p" style="color:var(--glow); cursor:pointer;" onclick="toggleMode()">नया अकाउंट? रजिस्टर करें</p>
            </div>
        </div>
    </div>

    <div id="main-content">
        <nav>
            <div style="color:var(--glow); font-weight:bold;">➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸</div>
            <button onclick="logout()" style="color:red; background:none; border:1px solid red; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold;">LOGOUT</button>
        </nav>

        <div id="home-menu" class="menu-container">
            <div class="menu-card" onclick="showSection('section-our')">📖 OUR BATCHES</div>
            <div class="menu-card" onclick="showSection('section-all')">📖 ALL BATCHES</div>
        </div>

        <div id="section-our" class="content-section">
            <h2 style="color:var(--glow);">📖 OUR BATCHES</h2>
            <div id="our-batches-list"></div>
            <button class="back-btn" onclick="goHome()">⬅️ BACK TO MENU</button>
        </div>

        <div id="section-all" class="content-section">
            <h2 style="color:var(--glow);">📖 ALL BATCHES</h2>
            <div id="all-batches-list" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>
            <button class="back-btn" onclick="goHome()">⬅️ BACK TO MENU</button>
        </div>

        <footer>© 2026 SACHIN SHARMA. ALL RIGHTS RESERVED.</footer>
    </div>

    <script>
        const SB_URL = "https://jnhkojxsckdgsvaagfhc.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaGtvanhzY2tkZ3N2YWFnZmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDIxMDYsImV4cCI6MjA5NDk3ODEwNn0.hPBHq55bv9F0g9-mmgukyYZdZc-YM_Ye4B7IPsGdles";
        const supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);

        let isLogin = true, otpSent = false;

        // ऑटो-डिटेक्ट यूजर स्टेट (Fixes Blank Screen)
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadData();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            }
        });

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "🔐 लॉगिन" : "📝 रजिस्ट्रेशन";
            document.getElementById('action-btn').innerText = isLogin ? "प्रवेश करें" : "OTP भेजें";
            document.getElementById('toggle-p').innerText = isLogin ? "नया अकाउंट? रजिस्टर करें" : "अकाउंट है? लॉगिन करें";
            document.getElementById('reg-extra').style.display = isLogin ? 'none' : 'block';
        }

        async function processAuth() {
            const email = document.getElementById('email').value, password = document.getElementById('password').value, mobile = document.getElementById('mobile').value, otp = document.getElementById('otp').value;
            if(!email || !password) return alert("विवरण भरें!");

            try {
                if (isLogin) {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                } else {
                    if (!otpSent) {
                        const { error } = await supabaseClient.auth.signInWithOtp({ email, options: { data: { phone: mobile } } });
                        if (error) throw error; alert("OTP भेजा गया!"); otpSent = true;
                        document.getElementById('otp-area').style.display = "block";
                    } else {
                        const { error } = await supabaseClient.auth.verifyOtp({ email, token: otp, type: 'email' });
                        if (error) throw error;
                    }
                }
            } catch(e) { alert("सूचना: " + e.message); }
        }

        function showSection(id) {
            document.getElementById('home-menu').style.display = 'none';
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function goHome() {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('home-menu').style.display = 'flex';
            window.scrollTo(0,0);
        }

        async function loadData() {
            const { data: n } = await supabaseClient.from('batches').select('*').order('created_at', { ascending: false });
            const { data: d } = await supabaseClient.from('demo_batches').select('*').order('created_at', { ascending: false });
            
            const nL = document.getElementById('our-batches-list');
            const dL = document.getElementById('all-batches-list');
            nL.innerHTML = ""; dL.innerHTML = "";

            if(n) n.forEach(b => {
                nL.innerHTML += `<a href="${b.link}" class="magic-btn"><span class="btn-content"><b>${b.name}</b><br><small>${b.description}</small></span><div class="rainbow-glow"></div></a>`;
            });

            if(d) d.forEach(b => {
                dL.innerHTML += `
                    <div class="demo-card">
                        <img src="${b.thumbnail}">
                        <div class="card-body">
                            <h3 style="color:var(--glow); margin: 0;">${b.name}</h3>
                            <p style="font-size: 0.8rem; color: #888; margin: 5px 0;">📅 वैधता: ${b.validity || '1 Year'}</p>
                            
                            <div class="buy-method-box">
                                <b>💳 पेमेंट कैसे करें:</b><br>
                                1. नीचे 🎁 बटन से गिफ्ट कार्ड खरीदें।<br>
                                2. Buy New Card चुनें और ₹${b.offer_price} पे करें।<br>
                                3. कोड का स्क्रीनशॉट मुझे भेजें।
                            </div>

                            <a href="https://phon.pe/4fjyavab" target="_blank" class="phonepe-btn">🎁 BUY PHONEPE GIFT CARD</a>

                            <h2 style="color:#0f0; margin: 10px 0; text-align: center;">₹${b.offer_price}</h2>

                            <a href="https://t.me/UPSC_ASPIRANT1210?text=नमस्ते सचिन सर, मैंने ${b.name} के लिए गिफ्ट कार्ड खरीद लिया है। यह रहा स्क्रीनशॉट।" class="screenshot-btn">🛒 SEND SCREENSHOT</a>
                        </div>
                    </div>`;
            });
        }

        function logout() { supabaseClient.auth.signOut(); }

        // Stars Logic
        const canvas = document.getElementById('canvas-stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let stars = [];
        for(let i=0; i<80; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height); ctx.fillStyle="white";
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill(); s.y+=0.3; if(s.y>canvas.height) s.y=0; });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
