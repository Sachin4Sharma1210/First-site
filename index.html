<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glow: #00d2ff; }
        body { margin: 0; background: #010101; color: white; font-family: sans-serif; text-align: center; }
        .auth-box { border: 2px solid var(--glow); padding: 30px; border-radius: 20px; width: 300px; margin: 100px auto; background: #000; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #111; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--glow); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        #main-portfolio { display: none; padding: 50px; }
        .batch { border: 1px solid #333; padding: 20px; margin: 10px auto; max-width: 400px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-section">
        <div class="auth-box">
            <img src="https://files.catbox.moe/qik5aw.png" style="width:80px; border-radius:50%;">
            <h2>🔐 LOGIN</h2>
            <input type="email" id="email" placeholder="Email">
            <div id="reg-div" style="display:none;">
                <input type="number" id="mobile" placeholder="Mobile (10 Digits)">
            </div>
            <input type="password" id="password" placeholder="Password">
            <button id="btn" onclick="handleAuth()">प्रवेश करें</button>
            <p onclick="toggle()" style="cursor:pointer; font-size:12px; color:var(--glow); margin-top:15px;">New User? Register</p>
            <div style="margin-top:20px; font-size:10px; color:#444;">© 2026 SACHIN SHARMA</div>
        </div>
    </div>

    <div id="main-portfolio">
        <h1>नमस्ते, सचिन भाई!</h1>
        <div class="batch">📚 SSC Pratham <br> <a href="https://robust-tan-ayf5zif9ft.edgeone.app/" style="color:var(--glow)">Open Batch</a></div>
        <div class="batch">📚 SSC CGL Foundation <br> <a href="https://courageous-maroon-khztehhvyz.edgeone.app/" style="color:var(--glow)">Open Batch</a></div>
        <button onclick="logout()" style="width:auto; background:red; color:white; padding:5px 20px;">Logout</button>
    </div>

    <script>
        const SB_URL = "https://jnhkojxsckdgsvaagfhc.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaGtvanhzY2tkZ3N2YWFnZmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDIxMDYsImV4cCI6MjA5NDk3ODEwNn0.hPBHq55bv9F0g9-mmgukyYZdZc-YM_Ye4B7IPsGdles";
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let isLogin = true;
        function toggle() {
            isLogin = !isLogin;
            document.getElementById('reg-div').style.display = isLogin ? 'none' : 'block';
            document.getElementById('btn').innerText = isLogin ? 'प्रवेश करें' : 'Register';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mobile = document.getElementById('mobile').value;

            if(!isLogin) {
                if(mobile.length !== 10) return alert("10 अंकों का नंबर डालें");
                const { error } = await supabase.auth.signUp({ email, password, options: { data: { phone: mobile } } });
                if(error) alert(err.message); else alert("ईमेल चेक करें!");
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) alert(error.message); else show();
            }
        }

        async function show() {
            const { data: { user } } = await supabase.auth.getUser();
            if(user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('main-portfolio').style.display = 'block';
            }
        }
        function logout() { supabase.auth.signOut().then(() => location.reload()); }
        window.onload = show;
    </script>
</body>
</html>
