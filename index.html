<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸 | Official</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glow: #00d2ff; --bg: #010101; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        #canvas-stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #090A0F; }
        .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-box { background: rgba(10, 10, 10, 0.95); border: 2px solid var(--glow); padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .auth-btn { width: 100%; padding: 14px; background: var(--glow); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.1rem; }
        #main-content { display: none; padding-top: 80px; text-align: center; }
        nav { position: fixed; top: 0; width: 100%; padding: 15px 0; display: flex; justify-content: space-around; background: rgba(0,0,0,0.9); z-index: 1000; border-bottom: 1px solid #222; }
        .menu-card { background: rgba(255,255,255,0.05); border: 2px solid var(--glow); padding: 20px; border-radius: 20px; width: 140px; cursor: pointer; margin: 10px; display: inline-block; }
        .content-section { display: none; padding: 20px; }
        .content-section.active { display: block; }
        .demo-card { background: #0a0a0a; border: 1px solid var(--glow); border-radius: 15px; width: 100%; max-width: 320px; margin: 15px auto; overflow: hidden; text-align: left; }
        .demo-card img { width: 100%; height: 180px; object-fit: cover; }
        .magic-btn { padding: 20px; background: #000; color: #fff; text-decoration: none; border-radius: 15px; display: block; margin: 10px auto; border: 1px solid var(--glow); width: 90%; }
        .back-btn { background: #333; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-top: 20px; border: none; }
    </style>
</head>
<body>
    <canvas id="canvas-stars"></canvas>
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2 id="title">🔐 लॉगिन</h2>
            <input type="email" id="email" placeholder="ईमेल">
            <div id="reg-extra" style="display:none;"><input type="text" id="mobile" placeholder="मोबाइल नंबर"></div>
            <input type="password" id="password" placeholder="पासवर्ड">
            <div id="otp-area" style="display:none;"><input type="text" id="otp" placeholder="OTP दर्ज करें"></div>
            <button class="auth-btn" id="action-btn" onclick="processAuth()">प्रवेश करें</button>
            <p id="toggle-p" style="color:var(--glow); cursor:pointer; margin-top:15px;" onclick="toggleMode()">नया अकाउंट? रजिस्टर करें</p>
        </div>
    </div>
    <div id="main-content">
        <nav><div style="color:var(--glow); font-weight:bold;">➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸</div><button onclick="logout()" style="color:red; background:none; border:1px solid red; padding:5px 10px; cursor:pointer;">LOGOUT</button></nav>
        <div id="home-menu"><div class="menu-card" onclick="showSection('section-our')">📖 OUR BATCHES</div><div class="menu-card" onclick="showSection('section-all')">📖 ALL BATCHES</div></div>
        <div id="section-our" class="content-section"><div id="our-batches-list"></div><button class="back-btn" onclick="goHome()">⬅️ BACK</button></div>
        <div id="section-all" class="content-section"><div id="all-batches-list"></div><button class="back-btn" onclick="goHome()">⬅️ BACK</button></div>
    </div>
    <script>
        const SB_URL = "https://jnhkojxsckdgsvaagfhc.supabase.co", SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaGtvanhzY2tkZ3N2YWFnZmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDIxMDYsImV4cCI6MjA5NDk3ODEwNn0.hPBHq55bv9F0g9-mmgukyYZdZc-YM_Ye4B7IPsGdles";
        const supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
        let isLogin = true, otpSent = false;
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) { document.getElementById('auth-container').style.display = 'none'; document.getElementById('main-content').style.display = 'block'; loadData(); }
            else { document.getElementById('auth-container').style.display = 'flex'; document.getElementById('main-content').style.display = 'none'; }
        });
        function toggleMode() { isLogin = !isLogin; document.getElementById('title').innerText = isLogin ? "🔐 लॉगिन" : "📝 रजिस्ट्रेशन"; document.getElementById('reg-extra').style.display = isLogin ? 'none' : 'block'; document.getElementById('action-btn').innerText = isLogin ? "प्रवेश करें" : "OTP भेजें"; }
        async function processAuth() {
            const email = document.getElementById('email').value, password = document.getElementById('password').value, mobile = document.getElementById('mobile').value, otp = document.getElementById('otp').value;
            try {
                if (isLogin) { const { error } = await supabaseClient.auth.signInWithPassword({ email, password }); if (error) throw error; }
                else {
                    if (!otpSent) { const { error } = await supabaseClient.auth.signInWithOtp({ email, options: { data: { phone: mobile } } }); if (error) throw error; alert("OTP ईमेल पर भेजा गया!"); otpSent = true; document.getElementById('otp-area').style.display = "block"; }
                    else { const { error } = await supabaseClient.auth.verifyOtp({ email, token: otp, type: 'email' }); if (error) throw error; }
                }
            } catch(e) { alert(e.message); }
        }
        async function loadData() {
            const { data: n } = await supabaseClient.from('batches').select('*'); const { data: d } = await supabaseClient.from('demo_batches').select('*');
            const nL = document.getElementById('our-batches-list'), dL = document.getElementById('all-batches-list');
            nL.innerHTML = ""; dL.innerHTML = "";
            if(d) d.forEach(b => { dL.innerHTML += `<div class="demo-card"><img src="${b.thumbnail}"><div style="padding:15px;"><h3 style="color:var(--glow);">${b.name}</h3><a href="https://phon.pe/4fjyavab" class="auth-btn" style="display:block; text-decoration:none; text-align:center; background:#5f259f; color:white; margin:10px 0;">🎁 BUY GIFT CARD</a><h2 style="color:#0f0; text-align:center;">₹${b.offer_price}</h2><a href="https://t.me/UPSC_ASPIRANT1210" style="display:block; background:#00ff00; color:black; padding:10px; text-align:center; border-radius:8px; text-decoration:none; font-weight:bold;">🛒 SEND SCREENSHOT</a></div></div>`; });
            if(n) n.forEach(b => { nL.innerHTML += `<a href="${b.link}" class="magic-btn"><b>${b.name}</b><br><small>${b.description}</small></a>`; });
        }
        function showSection(id) { document.getElementById('home-menu').style.display = 'none'; document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function goHome() { document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active')); document.getElementById('home-menu').style.display = 'block'; }
        function logout() { supabaseClient.auth.signOut(); }
    </script>
</body>
</html>
