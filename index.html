<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸 | Official</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glow: #00d2ff; --bg: #010101; --pink: #ff007f; --purple: #9d00ff; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        
        /* --- AUTH SECTION --- */
        .auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .auth-box { background: rgba(10, 10, 10, 0.95); border: 2px solid var(--glow); padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); }
        .profile-img-auth { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--glow); margin-bottom: 15px; object-fit: cover; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; outline: none; }
        .auth-btn { width: 100%; padding: 14px; background: var(--glow); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.1rem; transition: 0.3s; }

        /* --- DASHBOARD --- */
        #main-content { display: none; padding-top: 80px; text-align: center; width: 100%; }
        nav { position: fixed; top: 0; width: 100%; padding: 15px 0; display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid #222; }

        /* COLORFUL CARDS (All Batches) */
        .demo-card { 
            background: linear-gradient(145deg, #1a1a1a, #000); 
            border: 2px solid var(--glow); border-radius: 20px; margin: 20px auto; max-width: 340px; overflow: hidden; box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }
        .demo-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid var(--glow); }
        .card-body { padding: 15px; text-align: left; }

        /* PAYMENT BOX */
        .payment-info { background: rgba(255, 255, 255, 0.05); border: 1px dashed var(--glow); padding: 10px; border-radius: 10px; margin: 10px 0; font-size: 0.8rem; line-height: 1.4; color: #eee; }

        /* RAINBOW BUTTONS (Our Batches) */
        .magic-btn { 
            background: linear-gradient(90deg, var(--purple), var(--pink));
            color: white; padding: 20px; border-radius: 15px; display: block; margin: 15px auto; width: 85%; text-decoration: none; font-weight: bold; font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4); border: none;
        }

        .section-title { color: var(--glow); margin: 30px 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .back-btn { background: #333; color: white; border: none; padding: 12px 25px; border-radius: 30px; cursor: pointer; margin: 20px auto; display: block; }
    </style>
</head>
<body>

    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <img src="https://files.catbox.moe/qik5aw.png" class="profile-img-auth">
            <h2 id="title">🔐 लॉगिन</h2>
            <input type="email" id="email" placeholder="ईमेल">
            <div id="reg-extra" style="display:none;"><input type="text" id="mobile" placeholder="मोबाइल नंबर"></div>
            <input type="password" id="password" placeholder="पासवर्ड">
            <div id="otp-area" style="display:none;"><input type="text" id="otp" placeholder="ओटीपी (Email से)"></div>
            <button class="auth-btn" id="action-btn" onclick="processAuth()">प्रवेश करें</button>
            <p id="toggle-p" style="color:var(--glow); cursor:pointer; margin-top:20px;" onclick="toggleMode()">नया अकाउंट? रजिस्टर करें</p>
        </div>
    </div>

    <div id="main-content">
        <nav><div style="color:var(--glow); font-weight:bold;">➤ 𝕊𝔸ℂℍ𝕀ℕ 𝕊ℍ𝔸ℝ𝕄𝔸</div><button onclick="logout()" style="color:red; background:none; border:1px solid red; padding:5px 10px; border-radius:5px; cursor:pointer;">LOGOUT</button></nav>

        <div id="home-menu">
            <div class="magic-btn" style="background: #111; border: 2px solid var(--glow);" onclick="showSection('section-our')">📖 OUR BATCHES</div>
            <div class="magic-btn" style="background: #111; border: 2px solid var(--glow);" onclick="showSection('section-all')">🌟 ALL BATCHES</div>
        </div>

        <div id="section-our" style="display:none;">
            <h2 class="section-title">📖 OUR BATCHES</h2>
            <div id="our-batches-list"></div>
            <button class="back-btn" onclick="goHome()">⬅️ वापस मेनू</button>
        </div>

        <div id="section-all" style="display:none;">
            <h2 class="section-title">🌟 ALL BATCHES</h2>
            <div id="all-batches-list"></div>
            <button class="back-btn" onclick="goHome()">⬅️ वापस मेनू</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://jnhkojxsckdgsvaagfhc.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuaGtvanhzY2tkZ3N2YWFnZmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDIxMDYsImV4cCI6MjA5NDk3ODEwNn0.hPBHq55bv9F0g9-mmgukyYZdZc-YM_Ye4B7IPsGdles";
        const supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);

        let isLogin = true, otpSent = false;

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadData();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            }
        });

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "🔐 लॉगिन" : "📝 रजिस्ट्रेशन";
            document.getElementById('action-btn').innerText = isLogin ? "प्रवेश करें" : "OTP भेजें";
            document.getElementById('reg-extra').style.display = isLogin ? 'none' : 'block';
        }

        async function processAuth() {
            const email = document.getElementById('email').value, password = document.getElementById('password').value, mobile = document.getElementById('mobile').value, otp = document.getElementById('otp').value;
            try {
                if (isLogin) {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                } else {
                    if (!otpSent) {
                        const { error } = await supabaseClient.auth.signInWithOtp({ email, options: { data: { phone: mobile } } });
                        if (error) throw error; alert("ओटीपी भेजा गया!"); 
                        otpSent = true; document.getElementById('otp-area').style.display = "block";
                    } else {
                        const { error } = await supabaseClient.auth.verifyOtp({ email, token: otp, type: 'email' });
                        if (error) throw error;
                    }
                }
            } catch(e) { alert(e.message); }
        }

        async function loadData() {
            const { data: n } = await supabaseClient.from('batches').select('*');
            const { data: d } = await supabaseClient.from('demo_batches').select('*');
            const nL = document.getElementById('our-batches-list'), dL = document.getElementById('all-batches-list');
            nL.innerHTML = ""; dL.innerHTML = "";

            if(d) d.forEach(b => {
                dL.innerHTML += `
                    <div class="demo-card">
                        <img src="${b.thumbnail}">
                        <div class="card-body">
                            <h3 style="color:var(--glow); margin:0;">${b.name}</h3>
                            <div class="payment-info">
                                <b>💳 पेमेंट कैसे करें:</b><br>
                                1. नीचे 🎁 बटन से गिफ्ट कार्ड लें।<br>
                                2. Buy New Card चुनें और ₹${b.offer_price} पे करें।<br>
                                3. स्क्रीनशॉट मुझे भेजें।
                            </div>
                            <a href="https://phon.pe/4fjyavab" target="_blank" style="display:block; background:#5f259f; color:white; padding:10px; border-radius:10px; text-decoration:none; font-weight:bold; text-align:center; margin-bottom:10px;">🎁 BUY PHONEPE GIFT CARD</a>
                            <h2 style="color:#0f0; margin:10px 0; text-align:center;">₹${b.offer_price}</h2>
                            <a href="https://t.me/Avigat1210?text=नमस्ते सचिन सर, मैंने ${b.name} के लिए पेमेंट कर दिया है।" target="_blank" style="display:block; background:#00ff00; color:black; padding:12px; border-radius:10px; text-decoration:none; font-weight:bold; text-align:center;">🛒 SEND SCREENSHOT</a>
                        </div>
                    </div>`;
            });

            if(n) n.forEach(b => {
                nL.innerHTML += `<a href="${b.link}" class="magic-btn">${b.name}<br><small style="font-weight:normal;">${b.description}</small></a>`;
            });
        }

        function showSection(id) {
            document.getElementById('home-menu').style.display = 'none';
            document.getElementById('section-our').style.display = id === 'section-our' ? 'block' : 'none';
            document.getElementById('section-all').style.display = id === 'section-all' ? 'block' : 'none';
        }

        function goHome() {
            document.getElementById('home-menu').style.display = 'block';
            document.getElementById('section-our').style.display = 'none';
            document.getElementById('section-all').style.display = 'none';
        }

        function logout() { supabaseClient.auth.signOut(); }
    </script>
</body>
</html>
